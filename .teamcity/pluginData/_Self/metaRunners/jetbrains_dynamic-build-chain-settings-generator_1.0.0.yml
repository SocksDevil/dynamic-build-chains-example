name: jetbrains/dynamic-build-chain-settings-generator
version: 1.0.0
title: Dynamic Build Chain Settings Generator
description: "A two-step recipe that can be used to dynamically generate settings\
  \ for a build chain.\nThis recipe executes the generation step and publishes the\
  \ settings as an artifact.\nThis recipe prepares an environment so that the DSL\
  \ runs as if it were generating settings\nwithin the context of your project. To\
  \ do so, it needs credentials with EDIT permissions to\nthe project. \n"
inputs:
  - SERVER_URL:
      type: text
      required: false
      label: Server URL
      description: "The full TeamCity server URL (for example, https://teamcity.jetbrains.com).\
        \ \nThe default value is %teamcity.serverUrl%.\n"
      default: '%teamcity.serverUrl%'
  - PROJECT_ID:
      type: text
      required: true
      label: Project ID
      description: |
        The project ID whose generated configs are relative to.
  - env.input_params:
      type: text
      required: false
      label: DSL parameters
      description: "A list of newline-delimited 'name=value' parameters to write to\
        \ \nthe 'params.properties' file. (Read this file to create parameter-based\
        \ conditions for the generator.)\n"
  - agent_token:
      type: password
      required: true
      label: Agent token
      description: |
        Bearer token with EDIT permissions to the project.
steps:
  - name: Generate dsl params file
    script: |
      #!/usr/bin/env bash
      set -euo pipefail

      cd .teamcity

      echo "IS_DYNAMIC_CHAIN=true" > params.properties

      if [ -n "${input_params:-}" ]; then
        IFS=',' read -ra pairs <<< "$input_params"
        for pair in "${pairs[@]}"; do
          # trim surrounding whitespace and skip empty entries
          pair="$(printf '%s' "$pair" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -z "$pair" ] && continue
          echo "$pair" >> params.properties
        done
      fi
  - name: Generate Settings
    script: |
      cd .teamcity/

      curl -sSf --header "Authorization: Bearer %agent_token%" -o dsl-context.zip "%SERVER_URL%/app/dsl-context?projectExtId=%PROJECT_ID%"

      mvn -Dteamcity.versionedSettings.exposeInternalParameters=true -Dteamcity.internal.dsl.IS_DYNAMIC_CHAIN=true -DserverContext=dsl-context.zip teamcity-configs:generate -f pom.xml

      rm -rf "target/generated-configs/%DSL_RELATIVE_ROOT_ID%"
